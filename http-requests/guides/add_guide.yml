info:
  name: Add Guide
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/guides
  body:
    type: json
    data: |-
      {
        "title": "Como denunciar buracos na rua",
        "description": "Passo a passo para registrar a reclamacao",
        "content": "Conteudo completo do guia aqui.",
        "coverImage": 0,
        "user": { "id": 1 },
        "agency": { "id": 1 }
