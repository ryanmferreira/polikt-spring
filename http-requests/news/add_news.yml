        "body": "## Pesquisas para a eleição de 2026\n\nPesquisas recentes do **BTG/Nexus** e do **Datafolha** mostram o presidente Luiz Inácio Lula da Silva numericamente à frente de Flávio Bolsonaro nos cenários testados para a eleição presidencial de 2026.\n\n---\n\n## BTG/Nexus\n\nNo levantamento divulgado em **24 de agosto**, Lula aparece com **41% das intenções de voto**, enquanto Flávio Bolsonaro registra **37%**.\n\n---\n\n## Demais candidatos\n\nOs demais candidatos aparecem com os seguintes percentuais no cenário pesquisado:\n\n- Ronaldo Caiado (PSD): **5%**\n- Renan Santos (Missão): **3%**\n- Romeu Zma (Novo): **3%**\n- Augusto Cury (Avante): **2%**\n- Samara Martins (UP): **1%**\n- Nenhum, branco ou nulo: **5%**\n- Não sabe ou não respondeu: **3%**\n\n---\n\n## Como interpretar os números\n\nOs números representam as intenções de voto no cenário pesquisado e **não constituem uma previsão do resultado da eleição**.\n\nPesquisas eleitorais retratam o cenário no momento em que são realizadas e podem mudar conforme a campanha eleitoral avança.",
